version: 2
updates:
  # Python dependencies (managed by uv — pyproject.toml + uv.lock).
  # Dependabot has native `uv` ecosystem support; the previous `pip`
  # ecosystem did not keep uv.lock up to date for this project.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # python-magic is hard-pinned to ==0.4.24 in pyproject.toml because
      # splunk-appinspect 4.2.1 requires exactly that version. Any bump makes
      # the resolve unsatisfiable, so let splunk-appinspect dictate it.
      - dependency-name: "python-magic"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
