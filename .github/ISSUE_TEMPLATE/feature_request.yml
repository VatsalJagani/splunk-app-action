name: 🚀 Feature request
description: Submit a proposal/request for a new feature in this GitHub Action
labels: 'feature request'

body:
- type: markdown
  attributes:
    value: |
      **Note:** If your feature request relates to a workflow, please include relevant YAML snippets.
- type: textarea
  attributes:
    label: 🚀 The feature, motivation and pitch
    description: |
      A clear and concise description of the feature proposal. Please outline the motivation for the proposal.
      Is your feature request related to a specific problem? e.g., *"I'm working on X and would like Y to be possible"*.
      If this is related to another GitHub issue, please link here too.
  validations:
    required: true
- type: textarea
  attributes:
    label: Alternatives
    description: |
      A description of any alternative solutions or features you've considered, if any.
- type: textarea
  attributes:
    label: Additional context
    description: |
      Add any other context, screenshots, or workflow YAML about the feature request.
- type: markdown
  attributes:
    value: |
      Thanks for contributing 🎉!
