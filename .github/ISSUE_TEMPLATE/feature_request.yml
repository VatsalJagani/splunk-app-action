name: 🚀 [feature] Feature request
labels: 'feature request'
description: Submit a proposal/request for a new feature or improvement to this GitHub Action

body:
- type: textarea
  attributes:
    label: 🚀 [feature] The feature, motivation and pitch
    description: |
      A clear and concise description of the feature proposal. Please outline the motivation for the proposal, especially in the context of GitHub Actions workflows. Is your feature request related to a specific workflow or event? If this is related to another GitHub issue, please link here too.
  validations:
    required: true

- type: textarea
  attributes:
    label: Alternatives
    description: |
      A description of any alternative solutions or features you've considered, if any.

- type: textarea
  attributes:
    label: Additional context
    description: |
      Add any other context, workflow YAML, or screenshots about the feature request.

- type: markdown
  attributes:
    value: |
      Thanks for contributing 🎉 [feature]!
