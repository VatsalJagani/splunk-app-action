name: 🐛 [bug] Bug Report
labels: 'bug'
description: Create a report to help us reproduce and fix the bug

body:
- type: markdown
  attributes:
    value: |
      #### Before submitting a bug, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/VatsalJagani/splunk-app-action/issues?q=is%3Aissue+sort%3Acreated-desc+).
      For GitHub Actions, please include:
      - The workflow YAML that uses this action
      - The full log output from the Actions run (copy from the Actions tab)
      - Any relevant configuration, inputs, or secrets

- type: textarea
  attributes:
    label: 🐛 [bug] Describe the bug
    description: |
      Please provide a clear and concise description of what the bug is.
      If relevant, add a minimal workflow example so that we can reproduce the error by running the action. Please include the relevant YAML and Python code snippets.
      Paste or describe the results you observe instead of the expected results. If you observe an error, please paste the error message including the **full** traceback.
    placeholder: |
      A clear and concise description of what the bug is.
  validations:
    required: true

- type: textarea
  attributes:
    label: Versions
    description: |
      Please run the following and paste the output below.
      ```sh
      python --version && pip freeze
      ```
