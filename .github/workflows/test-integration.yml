          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All outputs validated successfully!" >> $GITHUB_STEP_SUMMARY
          fi


  # Test 9: Local app-inspect with failing app (should fail but not crash)
  test-local-appinspect-fail:
    name: Test Local App-Inspect (Fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run splunk-app-action with local app-inspect on failing app
        id: inspect_fail
        uses: VatsalJagani/splunk-app-action@integration_tests
        continue-on-error: true
        with:
          app_dir: "tests/integration_test_apps/app_inspect_fail"
          local_app_inspect: true
      
      - name: Verify app-inspect failed as expected and check outputs
        run: |
          echo "## Local App-Inspect Failure Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check outputs
          echo "### Action Outputs:" >> $GITHUB_STEP_SUMMARY
          echo "- build_path: \`${{ steps.inspect_fail.outputs.build_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- artifact_name: \`${{ steps.inspect_fail.outputs.artifact_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- app_package_id: \`${{ steps.inspect_fail.outputs.app_package_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- app_inspect_status: \`${{ steps.inspect_fail.outputs.app_inspect_status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          VALIDATION_PASSED=true
          
          # Validate app_inspect_status is NOT "Passed"
          if [ -z "${{ steps.inspect_fail.outputs.app_inspect_status }}" ]; then
            echo "⚠️ app_inspect_status is empty (composite action output issue)"
            VALIDATION_PASSED=false
          elif [ "${{ steps.inspect_fail.outputs.app_inspect_status }}" == "Passed" ]; then
            echo "❌ Expected app_inspect_status to be 'Failure' or 'Error', but got 'Passed'"
            echo "This failing app should NOT pass inspection!"
            exit 1
          else
            echo "✅ app_inspect_status correctly indicates failure: ${{ steps.inspect_fail.outputs.app_inspect_status }}"
          fi
          
          # Validate artifact outputs
          if [ -z "${{ steps.inspect_fail.outputs.artifact_name }}" ]; then
            echo "⚠️ artifact_name is empty (composite action output issue)"
            VALIDATION_PASSED=false
          else
            echo "✅ artifact_name: ${{ steps.inspect_fail.outputs.artifact_name }}"
          fi
          
          if [ -z "${{ steps.inspect_fail.outputs.app_package_id }}" ]; then
            echo "⚠️ app_package_id is empty (composite action output issue)"
