          echo "- cloud_inspect_status: \`${{ steps.inspect_valid.outputs.cloud_inspect_status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ssai_inspect_status: \`${{ steps.inspect_valid.outputs.ssai_inspect_status }}\`" >> $GITHUB_STEP_SUMMARY
