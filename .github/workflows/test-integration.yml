          elif [ "${{ steps.inspect_fail.outputs.app_package_id }}" != "failing_test_app" ]; then
            echo "❌ Expected app_package_id 'failing_test_app', got '${{ steps.inspect_fail.outputs.app_package_id }}'"
            VALIDATION_PASSED=false
          else
            echo "✅ app_package_id: ${{ steps.inspect_fail.outputs.app_package_id }}"
          fi
          
          # Check if inspect report exists (even for failed inspections)
          if [ -d "failing_test_app_1_0_0_1_reports" ]; then
            echo "✅ App-inspect reports generated for failing app"
          else
            echo "⚠️ App-inspect reports not found"
          fi
          
          if [ "$VALIDATION_PASSED" = false ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning**: Some outputs are missing due to composite action limitations" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Failure correctly detected and outputs validated!" >> $GITHUB_STEP_SUMMARY
          fi


  # Summary job that depends on all tests
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: 
      - test-basic-build
      - test-python-deps
      - test-ucc-build
      - test-permissions-fail
      - test-permissions-pass
      - test-user-commands
      - test-multi-app
      - test-local-appinspect-pass
      - test-local-appinspect-fail
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All test scenarios have been executed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Jobs:" >> $GITHUB_STEP_SUMMARY
          echo "- Basic Build: ${{ needs.test-basic-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python Dependencies: ${{ needs.test-python-deps.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- UCC Build: ${{ needs.test-ucc-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Permissions (Pass): ${{ needs.test-permissions-pass.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Permissions (Fail): ${{ needs.test-permissions-fail.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- User Commands: ${{ needs.test-user-commands.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-App: ${{ needs.test-multi-app.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Local App-Inspect (Pass): ${{ needs.test-local-appinspect-pass.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Local App-Inspect (Fail): ${{ needs.test-local-appinspect-fail.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if any required test failed (excluding the expected-to-fail test)
          if [ "${{ needs.test-basic-build.result }}" != "success" ] || \
             [ "${{ needs.test-python-deps.result }}" != "success" ] || \
             [ "${{ needs.test-ucc-build.result }}" != "success" ] || \
             [ "${{ needs.test-permissions-pass.result }}" != "success" ] || \
             [ "${{ needs.test-permissions-fail.result }}" != "success" ] || \
             [ "${{ needs.test-user-commands.result }}" != "success" ] || \
             [ "${{ needs.test-multi-app.result }}" != "success" ] || \
             [ "${{ needs.test-local-appinspect-pass.result }}" != "success" ] || \
             [ "${{ needs.test-local-appinspect-fail.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some tests failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All required tests passed!" >> $GITHUB_STEP_SUMMARY
          fi
