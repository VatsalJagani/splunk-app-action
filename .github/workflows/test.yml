name: Build, Test, Checks

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@50cb469c430ff56d9c7f512b7f3c4a20980d3387 # v4.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      - name: Install all dependencies
        run: uv sync --all-extras

      - name: Run linting
        run: uv run python devtools/lint.py

      - name: Run tests
        env:
            SPLUNKBASE_USERNAME_FOR_TEST: ${{ secrets.SPLUNKBASE_USERNAME }}
            SPLUNKBASE_PASSWORD_FOR_TEST: ${{ secrets.SPLUNKBASE_PASSWORD }}
        run: uv run pytest --junitxml=junit/test-results.xml --cov=src --cov-config=tests/.coveragerc --cov-report=xml

      - name: Adding GitHub action step summary
        uses: VatsalJagani/pytest-cov-action@9e6db111ee2ae88cf6d84dce04416f8b069f5a17 # v1.3
        with:
          pytest_results_file: "junit/test-results.xml"
          pytest_cov_file: "coverage.xml"

      - name: Docs Check
        run: make docs-check
