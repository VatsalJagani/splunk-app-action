name: "Generate App Build, App Inspect Check and Splunk App Utilities"
description: "Automatically generate Splunk App/Add-on builds, and run app-inspect checks. Optionally add common Splunk App utilities."

branding:
  color: "purple"
  icon: "play"

inputs:
  app_dir:
    description: "Provide app directory inside your repository. Do not provide a value if the repo's root directory itself is the app directory."
    required: false
    default: "."

  to_make_permission_changes:
    description: "Whether to apply file and folder permission changes according to Splunk App Inspect expectation before generating the build."
    required: false
    default: false

  use_ucc_gen:
    description: "Use ucc-gen command to generate the build for Add-ons. The 'app_dir' folder must have a sub-folder named 'package' and a file named 'globalConfig.json' for this to work."
    required: false
    default: false

  is_remove_not_allowed_executables_from_lib:
    description: "Remove files with mimetype application/x-executable or application/x-sharedlib from UCC build output lib/ folder before packaging."
    required: false
    default: false

  python_requirements_file:
    description: "Path to the requirements.txt file for Python dependency management. Path is relative to the app_dir. When provided, dependencies will be installed before generating the build. This allows using GitHub Dependabot for automatic dependency updates."
    required: false
    default: ""

  splunk_python_version:
    description: "Python version to target when installing dependencies from python_requirements_file. Should match the Python version used by the Splunk platform (default: 3.13)."
    required: false
    default: "3.13"

  is_app_inspect_check:
    description: "Whether to perform the Splunk app-inspect checks or not. This would include cloud-inspect checks as well."
    required: false
    default: true

  splunkbase_username:
    description: "Username required to call the Splunkbase API for App-Inspect. Required when is_app_inspect_check is set to true."
    required: false

  splunkbase_password:
    description: "Password required to call the Splunkbase API for App-Inspect. Required when is_app_inspect_check is set to true. Strongly recommend to use via GitHub secrets only and specify like `{{secrets.MY_SPLUNK_PASSWORD}}`."
    required: false

  local_app_inspect:
    description: "Use local Splunk App Inspect validation with splunk-appinspect Python library instead of the Splunkbase API. This is faster but may not be as up-to-date as the Splunkbase API. When enabled, splunkbase_username and splunkbase_password are not required."
    required: false
    default: false

  fail_on:
    description: "Control when the action should fail based on AppInspect results. Options: 'errors' (fail on errors only), 'warnings' (fail on warnings or errors), 'none' (never fail based on results)."
    required: false
    default: "errors"

  app_utilities:
    description: "Add comma separated list of utilities to use. You need to enable read and write permission for workflow to create Pull Requests. Valid options: whats_in_the_app, logger, common_js_utilities, ucc_additional_packaging"
    required: false
    default: ""

  my_github_token:
    description: "GitHub token to create pull requests for app utilities. OPTIONAL when workflow has 'contents: write' and 'pull-requests: write' permissions - the action will automatically use the workflow's GITHUB_TOKEN. Only needed if you want to use a Personal Access Token (PAT) instead."
    required: false
    # Prefer using the automatically provided secrets.GITHUB_TOKEN from the workflow.
    # Keep this input for backward-compatibility if users want to provide a PAT.
    # Default is empty so the composite action can fall back to the job's GITHUB_TOKEN.
    default: ""

  logger_log_files_prefix:
    description: "Log files prefix. Only required for logger utility."
    required: false
    default: "NONE"

  logger_sourcetype:
    description: "Sourcetype for the internal app logs. Required only for logger utility."
    required: false
    default: "NONE"


runs:
  using: "composite"
  steps:
    - name: "Extracting the current branch name"
      shell: bash
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: extract_branch

    - name: "Clone the Repository"
      uses: actions/checkout@v5
      with:
        ref: ${{ steps.extract_branch.outputs.branch }}
        path: repodir

    - name: Install uv (official Astral action)
      uses: astral-sh/setup-uv@v5

    - name: Set up Python and install dependencies
      working-directory: ${{ github.action_path }}
      shell: bash
      run: |
        echo "Installing Python and dependencies..."
        uv python install 3.13
        uv sync --python 3.13

    - name: "Running the Splunk App actions"
      id: run_splunk_app_action
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        INPUT_APP_DIR: ${{ inputs.app_dir }}
        INPUT_USE_UCC_GEN: ${{ inputs.use_ucc_gen }}
        INPUT_IS_REMOVE_NOT_ALLOWED_EXECUTABLES_FROM_LIB: ${{ inputs.is_remove_not_allowed_executables_from_lib }}
        INPUT_PYTHON_REQUIREMENTS_FILE: ${{ inputs.python_requirements_file }}
        INPUT_SPLUNK_PYTHON_VERSION: ${{ inputs.splunk_python_version }}
        INPUT_TO_MAKE_PERMISSION_CHANGES: ${{ inputs.to_make_permission_changes }}
        INPUT_IS_APP_INSPECT_CHECK: ${{ inputs.is_app_inspect_check }}
        INPUT_SPLUNKBASE_USERNAME: ${{ inputs.splunkbase_username }}
        INPUT_SPLUNKBASE_PASSWORD: ${{ inputs.splunkbase_password }}
        INPUT_LOCAL_APP_INSPECT: ${{ inputs.local_app_inspect }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_APP_UTILITIES: ${{ inputs.app_utilities }}
        GITHUB_TOKEN: "${{ inputs.my_github_token || github.token }}"
        INPUT_CURRENT_BRANCH_NAME: ${{ steps.extract_branch.outputs.branch }}
        INPUT_LOGGER_LOG_FILES_PREFIX: ${{ inputs.logger_log_files_prefix }}
        INPUT_LOGGER_SOURCETYPE: ${{ inputs.logger_sourcetype }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        uv run python -u src/main.py

    - name: "Upload the app build as artifact"
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: "App-Build-${{env.app_package_id}}_${{env.app_version_encoded}}_${{env.app_build_number_encoded}}"
        path: ${{env.app_package_id}}_${{env.app_version_encoded}}_${{env.app_build_number_encoded}}.tgz

    - name: "Upload the app-inspect reports as artifact"
      uses: actions/upload-artifact@v7
      if: always() && inputs.is_app_inspect_check == 'true'
      with:
        name: "App-Inspect-Reports-${{env.app_package_id}}_${{env.app_version_encoded}}_${{env.app_build_number_encoded}}"
        path: ${{env.app_package_id}}_${{env.app_version_encoded}}_${{env.app_build_number_encoded}}_reports


outputs:
  build_path:
    description: "Full path to the generated build artifact (.tgz file)"
    value: ${{ steps.run_splunk_app_action.outputs.build_path }}
  artifact_name:
    description: "Name of the generated build artifact (e.g., my_app_1.0.0_1.tgz)"
    value: ${{ steps.run_splunk_app_action.outputs.artifact_name }}
  app_package_id:
    description: "The Splunk app package ID extracted from app.conf or globalConfig.json"
    value: ${{ steps.run_splunk_app_action.outputs.app_package_id }}
  app_version:
    description: "The app version number extracted from app.conf or globalConfig.json"
    value: ${{ steps.run_splunk_app_action.outputs.app_version }}
  app_build_number:
    description: "The app build number extracted from app.conf"
    value: ${{ steps.run_splunk_app_action.outputs.app_build_number }}
  app_inspect_status:
    description: "Status of app-inspect check (Passed, Warning, Failure, Error, Timed-out, Exception, Skipped, or Not Run)"
    value: ${{ steps.run_splunk_app_action.outputs.app_inspect_status }}
  cloud_inspect_status:
    description: "Status of cloud-inspect check (Passed, Warning, Failure, Error, Timed-out, Exception, Skipped, or Not Run)"
    value: ${{ steps.run_splunk_app_action.outputs.cloud_inspect_status }}
  ssai_inspect_status:
    description: "Status of SSAI-inspect check (Passed, Warning, Failure, Error, Timed-out, Exception, Skipped, or Not Run)"
    value: ${{ steps.run_splunk_app_action.outputs.ssai_inspect_status }}
